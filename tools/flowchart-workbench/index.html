<script>const INITIAL_DIAGRAMS = [{"id": 1, "title": "Basic process", "source": "flowchart TD\n A[Start] --> B[Process]\n B --> C[Finish]"}];</script>
<script>(() => {
  'use strict';
  const $ = id => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
  const KEY = 'iot-flowchart-blackwhite-v1', OLD = 'iot-standard-flowchart-v4-';
  const SHAPES = {terminator:'开始 / 结束',process:'处理',decision:'判断',data:'输入 / 输出',subprocess:'子程序',connector:'连接点',document:'文档'};
  const SIDES = {top:'上',right:'右',bottom:'下',left:'左'};
  const copy = value => JSON.parse(JSON.stringify(value));
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const svg = (name, attrs={}, text) => {const e=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;};
  let uid=Date.now(); const nextId=prefix=>prefix+(++uid);
  const units = text => [...text].reduce((s,c)=>s+(c.charCodeAt(0)<128?.56:1),0);
  function wrap(text, max) {const rows=[];for(const line of text.split('\n')){let row='',u=0;const tokens=line.match(/[A-Za-z0-9_.\/-]+|[^A-Za-z0-9_.\/-]/gu)||[''];for(const token of tokens){for(const c of units(token)>max?[...token]:[token]){const n=units(c);if(u+n>max&&row){rows.push(row.trim());row='';u=0;}if(!row&&!c.trim())continue;row+=c;u+=n;}}rows.push(row.trim());}return rows;}
  function lines(n) {return wrap(n.label, Math.max(2,(n.w*(n.shape==='decision'?.52:n.shape==='connector'?.64:.86)-12)/17));}
  function parse(d) {
    const nodes=[],edges=[],map=new Map();let direction='TD';
    function node(raw){const m=raw.trim().match(/^([\w-]+)(.*)$/);if(!m)return null;const id=m[1],s=m[2].trim();let shape='process',label=id;
      for(const [a,b,t] of [['([','])','terminator'],['{','}','decision'],['[/','/]','data'],['[[',']]','subprocess'],['[',']','process']])if(s.startsWith(a)&&s.endsWith(b)){shape=t;label=s.slice(a.length,-b.length).replace(/^"|"$/g,'').replace(/\\n/g,'\n');break;}
      if(!map.has(id)){const n={id,label,shape,x:0,y:0,w:240,h:64};map.set(id,n);nodes.push(n);}else if(s)Object.assign(map.get(id),{label,shape});return id;
    }
    for(const raw of d.source.split('\n')){const l=raw.trim();if(!l||l.startsWith('%%'))continue;if(l.startsWith('flowchart')){direction=l.split(/\s+/)[1];continue;}const a=l.indexOf('-->');if(a<0){node(l);continue;}let right=l.slice(a+3).trim(),label='';if(right[0]==='|'){const end=right.indexOf('|',1);label=right.slice(1,end).replace(/^"|"$/g,'');right=right.slice(end+1);}const from=node(l.slice(0,a)),to=node(right);if(from&&to)edges.push({id:'e'+edges.length,from,to,label,fromSide:'auto',toSide:'auto',points:null});}
    nodes.forEach(n=>{n.w=n.shape==='decision'?340:Math.min(340,Math.max(200,Math.ceil((units(n.label)*17+24)/.86/10)*10));n.h=n.shape==='decision'?110:Math.max(64,lines(n).length*24+24);});
    const result={id:d.id,title:d.title,direction,nodes,edges};layout(result);return result;
  }
  function layout(d){
    const out=new Map(d.nodes.map(n=>[n.id,[]])),back=new Set(),state=new Map();d.edges.forEach(e=>out.get(e.from)?.push(e));
    function visit(id){state.set(id,1);for(const e of out.get(id)||[]){if(state.get(e.to)===1)back.add(e.id);else if(!state.has(e.to))visit(e.to);}state.set(id,2);}d.nodes.forEach(n=>{if(!state.has(n.id))visit(n.id);});
    const indeg=new Map(d.nodes.map(n=>[n.id,0])),rank=new Map(d.nodes.map(n=>[n.id,0]));d.edges.filter(e=>!back.has(e.id)).forEach(e=>indeg.set(e.to,indeg.get(e.to)+1));const queue=d.nodes.filter(n=>indeg.get(n.id)===0).map(n=>n.id);
    while(queue.length){const id=queue.shift();for(const e of out.get(id)||[]){if(back.has(e.id))continue;rank.set(e.to,Math.max(rank.get(e.to),rank.get(id)+1));indeg.set(e.to,indeg.get(e.to)-1);if(!indeg.get(e.to))queue.push(e.to);}}
    const groups=[];d.nodes.forEach(n=>(groups[rank.get(n.id)]??=[]).push(n));const horiz=d.direction==='LR';let pos=70;
    const max=Math.max(780,...groups.map(g=>g.reduce((s,n)=>s+(horiz?n.h:n.w)+80,-80)))+100;
    for(const g of groups){const total=g.reduce((s,n)=>s+(horiz?n.h:n.w)+80,-80),size=Math.max(...g.map(n=>horiz?n.w:n.h));let cross=(max-total)/2;for(const n of g){n.x=Math.round((horiz?pos+size/2:cross+n.w/2)/10)*10;n.y=Math.round((horiz?cross+n.h/2:pos+size/2)/10)*10;cross+=(horiz?n.h:n.w)+80;}pos+=size+110;}
    d.edges.forEach(e=>{e.points=null;});
  }
  const originals=INITIAL_DIAGRAMS.map(parse);let diagrams=copy(originals),current=0,selected=null,mode='select',pending=null,zoom=1,drag=null,guides=[],cache=new Map();
  const history=new Map(),future=new Map();let startupNote='';
  function validate(data){if(!Array.isArray(data)||data.length!==17)throw Error('需要包含全部17张图。');for(const d of data){if(typeof d.title!=='string'||!Array.isArray(d.nodes)||!Array.isArray(d.edges)||d.nodes.length>500||d.edges.length>1000)throw Error('图形数据格式或数量无效。');const ids=new Set();for(const n of d.nodes){if(typeof n.id!=='string'||ids.has(n.id)||!SHAPES[n.shape]||typeof n.label!=='string'||n.label.length>300||!['x','y','w','h'].every(k=>Number.isFinite(n[k]))||n.w<40||n.h<30||n.w>1600||n.h>1600||n.x<0||n.y<0||n.x>20000||n.y>20000)throw Error('节点数据无效。');ids.add(n.id);}const eid=new Set();for(const e of d.edges){if(typeof e.id!=='string'||eid.has(e.id)||!ids.has(e.from)||!ids.has(e.to)||typeof e.label!=='string'||e.label.length>200||![e.fromSide,e.toSide].every(s=>s==='auto'||SIDES[s]))throw Error('连线数据无效。');eid.add(e.id);if(e.points&&(!Array.isArray(e.points)||e.points.length<2||e.points.length>100||e.points.some(p=>!Array.isArray(p)||p.length!==2||!p.every(Number.isFinite))||e.points.some((p,i)=>i&&p[0]!==e.points[i-1][0]&&p[1]!==e.points[i-1][1])))throw Error('连线必须仅含水平或竖直线段。');}}return data;}
  try{const saved=localStorage.getItem(KEY);if(saved){diagrams=validate(JSON.parse(saved).diagrams);startupNote='已恢复上次的编辑。';}else{let count=0;for(const d of diagrams){const old=JSON.parse(localStorage.getItem(OLD+d.id)||'null');for(const item of old?.nodes||[]){const n=d.nodes.find(n=>n.id===item.id);if(n&&Number.isFinite(item.x)&&Number.isFinite(item.y)){n.x=Math.max(n.w/2+30,item.x);n.y=Math.max(n.h/2+30,item.y);if(typeof item.label==='string')n.label=item.label;count++;}}}if(count)startupNote='已迁移旧版节点位置与文字。';}}catch{startupNote='保存的数据无法读取，已载入报告初始图。';}
  const active=()=>diagrams[current];const getNode=id=>active().nodes.find(n=>n.id===id);
  function status(text){$('status').textContent=text;}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,diagrams}));$('saveState').textContent='已自动保存';}catch{$('saveState').textContent='自动保存不可用，请保存编辑文件';}}
  function checkpoint(){const a=history.get(current)||[];a.push(JSON.stringify(active()));if(a.length>70)a.shift();history.set(current,a);future.set(current,[]);}
  function commit(){cache.clear();render();inspector();save();}
  function mutate(fn){checkpoint();fn();commit();}
  function undo(redo=false){const from=redo?future:history,to=redo?history:future,a=from.get(current)||[];if(!a.length)return;const b=to.get(current)||[];b.push(JSON.stringify(active()));to.set(current,b);diagrams[current]=JSON.parse(a.pop());selected=null;pending=null;commit();status(redo?'已重做。':'已撤销。');}
  function nav(){$('diagramList').innerHTML=diagrams.map((d,i)=>`<button data-diagram="${i}" class="${i===current?'active':''}" aria-current="${i===current?'page':'false'}"><span>${String(i+1).padStart(2,'0')}</span>${esc(d.title)}</button>`).join('');$('diagramPicker').innerHTML=diagrams.map((d,i)=>`<option value="${i}">${i+1}. ${esc(d.title)}</option>`).join('');$('diagramPicker').value=current;}
  function switchDiagram(i){current=i;selected=null;pending=null;mode='select';cache.clear();nav();render();inspector();$('stage').scrollTo(0,0);fit();status('选中方块或连线开始编辑。');}
  function sidePair(e){const a=getNode(e.from),b=getNode(e.to),horizontal=active().direction==='LR';let f,t;
    if(a.id===b.id){f='right';t='bottom';}else if(horizontal){if(b.x>a.x+20){f='right';t='left';}else{f='bottom';t='bottom';}}else if(b.y>a.y+20){f='bottom';t='top';}else if(Math.abs(b.y-a.y)<20){f=b.x>a.x?'right':'left';t=b.x>a.x?'left':'right';}else{f='right';t='right';}return [e.fromSide==='auto'?f:e.fromSide,e.toSide==='auto'?t:e.toSide];}
  function port(n,s){const x=n.x,y=n.y,w=n.w/2,h=n.h/2,skew=n.shape==='data'?11:0;return s==='top'?[x+skew,y-h]:s==='bottom'?[x-skew,y+h]:s==='left'?[x-w+(n.shape==='data'?11:0),y]:[x+w-(n.shape==='data'?11:0),y];}
  const vector=s=>s==='top'?[0,-1]:s==='bottom'?[0,1]:s==='left'?[-1,0]:[1,0];
  function simplify(p){const a=[];for(const q of p){if(a.length&&q[0]===a.at(-1)[0]&&q[1]===a.at(-1)[1])continue;while(a.length>1&&((a.at(-2)[0]===a.at(-1)[0]&&a.at(-1)[0]===q[0])||(a.at(-2)[1]===a.at(-1)[1]&&a.at(-1)[1]===q[1])))a.pop();a.push([...q]);}return a;}
  // Orthogonal visibility grid. Obstacle boundaries are candidates; A* penalizes bends.
  function route(a,b,obstacles){
    const xs=[...new Set([a[0],b[0],20,...obstacles.flatMap(r=>[r.l,r.r])])].sort((a,b)=>a-b),ys=[...new Set([a[1],b[1],20,...obstacles.flatMap(r=>[r.t,r.b])])].sort((a,b)=>a-b);
    const nx=xs.length,ny=ys.length,start=ys.indexOf(a[1])*nx+xs.indexOf(a[0]),end=ys.indexOf(b[1])*nx+xs.indexOf(b[0]);
    const inside=(x,y)=>obstacles.some(r=>x>r.l+.01&&x<r.r-.01&&y>r.t+.01&&y<r.b-.01);
    const blocked=(x,y,X,Y)=>obstacles.some(r=>x===X?x>r.l+.01&&x<r.r-.01&&Math.max(y,Y)>r.t+.01&&Math.min(y,Y)<r.b-.01:y>r.t+.01&&y<r.b-.01&&Math.max(x,X)>r.l+.01&&Math.min(x,X)<r.r-.01);
    const heap=[],dist=new Map(),prev=new Map();function push(item){heap.push(item);let i=heap.length-1;while(i){const p=(i-1)>>1;if(heap[p][0]<=item[0])break;heap[i]=heap[p];i=p;}heap[i]=item;}
    function pop(){const top=heap[0],last=heap.pop();if(heap.length){let i=0;while(i*2+1<heap.length){let j=i*2+1;if(j+1<heap.length&&heap[j+1][0]<heap[j][0])j++;if(heap[j][0]>=last[0])break;heap[i]=heap[j];i=j;}heap[i]=last;}return top;}
    const key=start*3;dist.set(key,0);push([0,key]);let found;
    while(heap.length){const [,k]=pop(),id=Math.floor(k/3),dir=k%3,cost=dist.get(k),ix=id%nx,iy=Math.floor(id/nx);if(id===end){found=k;break;}

  document.addEventListener('keydown',e=>{if($('confirmDialog').open||e.target.closest('input,textarea,select'))return;if(e.key==='Escape'){pending=null;mode='select';selected=null;render();inspector();return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo(e.shiftKey);return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'){e.preventDefault();undo(true);return;}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();remove();return;}if(selected?.type==='node'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const n=getNode(selected.id),step=e.shiftKey?10:1;mutate(()=>{n.x=Math.max(n.w/2+30,n.x+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0));n.y=Math.max(n.h/2+30,n.y+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0));});}});
  function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),20000);}
  function filename(d){return `${String(d.id).padStart(2,'0')}_${d.title.replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_')}.svg`;}
  function svgText(){const target=svg('svg',{xmlns:NS});draw(target,false);const style=svg('style',{},`.node-shape{fill:#fff;stroke:#000;stroke-width:1.7}.node-text{fill:#000;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;text-anchor:middle;dominant-baseline:middle}.edge-line{stroke:#000;stroke-width:1.7;fill:none;stroke-linejoin:miter;stroke-linecap:square}.edge-label{fill:#000;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;text-anchor:middle;dominant-baseline:middle}`);target.prepend(style);target.querySelectorAll('[role]').forEach(e=>{e.removeAttribute('role');e.removeAttribute('aria-label');});return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(target);}
  $('exportSvg').onclick=()=>{download(new Blob([svgText()],{type:'image/svg+xml'}),filename(active()));status('已导出白底黑线 SVG，不含网格和编辑控件。');};
  $('backup').onclick=()=>download(new Blob([JSON.stringify({version:1,diagrams},null,2)],{type:'application/json'}),'流程图编辑备份.json');
  $('import').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10e6)throw Error('文件不能超过10MB。');const data=validate(JSON.parse(await file.text()).diagrams);ask('导入编辑文件','将替换全部17张图；请确认已保存需要保留的编辑文件。',()=>{diagrams=data;history.clear();future.clear();selected=null;cache.clear();save();switchDiagram(0);status('全部图形已导入。');});}catch(error){status('导入失败：'+error.message);}e.target.value='';};
  // Uncompressed ZIP with UTF-8 names; no CDN or external dependency.
  function zip(files){const enc=new TextEncoder(),out=[],central=[];let offset=0;const crc=bytes=>{let c=-1;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0);}return(c^-1)>>>0;};const record=(len,fields)=>{const a=new Uint8Array(len),v=new DataView(a.buffer);for(const [at,val,size] of fields)size===2?v.setUint16(at,val,true):v.setUint32(at,val,true);return a;};for(const f of files){const name=enc.encode(f.name),data=enc.encode(f.text),c=crc(data),h=record(30,[[0,0x04034b50,4],[4,20,2],[6,0x800,2],[14,c,4],[18,data.length,4],[22,data.length,4],[26,name.length,2]]),ch=record(46,[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x800,2],[16,c,4],[20,data.length,4],[24,data.length,4],[28,name.length,2],[42,offset,4]]);out.push(h,name,data);central.push(ch,name);offset+=30+name.length+data.length;}const size=central.reduce((s,b)=>s+b.length,0),end=record(22,[[0,0x06054b50,4],[8,files.length,2],[10,files.length,2],[12,size,4],[16,offset,4]]);return new Blob([...out,...central,end],{type:'application/zip'});}
  $('exportAll').onclick=()=>{const old=current,files=[];try{for(current=0;current<diagrams.length;current++){cache.clear();files.push({name:filename(active()),text:svgText()});}download(zip(files),'黑白流程图SVG.zip');status('17张图已按名称打包导出。');}finally{current=old;cache.clear();}};
  nav();render();inspector();requestAnimationFrame(fit);if(startupNote)status(startupNote);
})();
</script>
