<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>流程图工作台 · 黑白编辑版</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:light;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#000;background:#fff;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:#000;background:#fff}button,select{cursor:pointer}button{border:1px solid #000;padding:8px 12px;white-space:nowrap}button:hover{background:#eee}button.active,button.primary{background:#000;color:#fff}button:disabled{opacity:.3;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px dashed #000;outline-offset:3px}input,select,textarea{border:1px solid #999;padding:8px;width:100%}textarea{resize:vertical;min-height:86px}input[type=checkbox]{width:auto;accent-color:#000}h1,h2,p{margin:0}header{height:68px;border-bottom:1px solid #000;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}h1{font-size:19px;letter-spacing:1px}header p{font-size:12px;margin-top:4px;color:#555}.header-actions{display:flex;gap:8px}main{display:grid;grid-template-columns:224px minmax(0,1fr) 242px;height:calc(100dvh - 68px)}nav{padding:18px 12px;overflow:auto;border-right:1px solid #000}.eyebrow{font-size:11px;letter-spacing:2px;color:#555;margin:0 8px 14px}#diagramList{display:grid;gap:5px}#diagramList button{display:flex;text-align:left;gap:10px;border:1px solid transparent;white-space:normal;line-height:1.5;padding:9px 8px}#diagramList button.active{border-color:#000;background:#fff;color:#000;font-weight:600}#diagramList span{font-size:12px;font-variant-numeric:tabular-nums;opacity:.6}article{min-width:0;display:flex;flex-direction:column}.doc-heading{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px;gap:10px}.doc-heading h2{font-size:18px}#count{font-size:12px;color:#555;white-space:nowrap}.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 12px;border-bottom:1px solid #aaa}.toolbar button{padding:6px 10px}.toolbar .sep{width:1px;background:#aaa;margin:0 4px}.options{padding:9px 20px;border-bottom:1px solid #aaa;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px}.options label{display:flex;gap:5px;align-items:center}.options button{padding:3px 7px;font-size:12px}#zoomLabel{min-width:38px;text-align:center}.zoom{display:flex;gap:6px;align-items:center;margin-left:auto}#stage{position:relative;overflow:auto;flex:1;background:#fff;min-height:220px;overscroll-behavior:contain}#diagram{display:block;background:#fff;touch-action:none;user-select:none}#diagram .node{cursor:move}#diagram .node-shape{fill:#fff;stroke:#000;stroke-width:1.7}#diagram .node-text{fill:#000;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}#diagram .edge-line{stroke:#000;stroke-width:1.7;fill:none;stroke-linejoin:miter;stroke-linecap:square;pointer-events:none}#diagram .edge-hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer;pointer-events:stroke}#diagram .edge-label{font-size:15px;fill:#000;text-anchor:middle;dominant-baseline:middle;pointer-events:none}#diagram .selection{fill:none;stroke:#000;stroke-width:1;stroke-dasharray:5 4;pointer-events:none}#diagram .handle{fill:#fff;stroke:#000;stroke-width:1.7;cursor:move}#diagram .port{fill:#fff;stroke:#000;stroke-width:1.7;cursor:crosshair}#diagram .guide{stroke:#000;stroke-width:1;stroke-dasharray:6 5;pointer-events:none}.statusbar{display:flex;gap:10px;justify-content:space-between;padding:9px 20px;border-top:1px solid #000;font-size:12px;min-height:36px}#saveState{white-space:nowrap;color:#555}aside{padding:20px 16px;border-left:1px solid #000;overflow:auto}aside h2{font-size:15px;margin-bottom:18px}aside label{display:block;font-size:12px;margin:12px 0 5px}aside p{color:#555;line-height:1.85;font-size:12px}.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}.panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hint{margin-top:22px;padding-top:16px;border-top:1px solid #aaa}.hint strong{display:block;color:#000;margin-bottom:6px}#inspector select{font-size:12px}#emptyPanel p{margin-bottom:12px}.badge{border:1px solid #000;padding:3px 7px;font-size:11px}.mobile-picker{display:none}dialog{background:#fff;color:#000;border:1px solid #000;max-width:420px;padding:24px}dialog::backdrop{background:#0006}dialog h2{font-size:18px;margin-bottom:12px}dialog p{line-height:1.8}dialog .panel-actions{justify-content:flex-end}a{color:#000}kbd{border:1px solid #aaa;padding:1px 4px}.footer-help{font-size:12px;padding:14px 8px;line-height:1.9;color:#555}
@media(max-width:1100px){main{grid-template-columns:184px minmax(0,1fr) 210px}header{padding:0 16px}header p{display:none}.doc-heading{padding:14px}.toolbar,.options{padding-left:14px;padding-right:14px}}
@media(max-width:850px){main{grid-template-columns:minmax(0,1fr) 210px}nav{display:none}.mobile-picker{display:block;width:100%;margin-bottom:8px}.doc-heading{flex-wrap:wrap}.header-actions button{padding:6px;font-size:12px}h1{font-size:15px}}
@media(max-width:580px){header{height:auto;min-height:68px;flex-wrap:wrap;padding:12px;gap:8px}main{display:flex;flex-direction:column;height:auto}article{height:76dvh;min-height:500px}aside{border-left:0;border-top:1px solid #000}#count{display:none}.toolbar{gap:5px}.toolbar button{font-size:12px}.statusbar{padding:8px;font-size:11px}.zoom{margin-left:0}.options{gap:8px}}
@media print{header,nav,aside,.doc-heading,.toolbar,.options,.statusbar{display:none!important}main,article,#stage{display:block;height:auto;overflow:visible}#diagram{width:100%!important;height:auto!important}.edit-only{display:none}}
</style>
</head>
<body>
<header><div><h1>流程图工作台 <span class="badge">黑白编辑版</span></h1><p>标准符号 · 正交连线 · 自由编排</p></div><div class="header-actions"><button id="backup">保存编辑文件</button><button id="import">导入编辑文件</button><button id="exportSvg" class="primary">导出 SVG</button></div></header>
<main>
<nav aria-label="流程图目录"><p class="eyebrow">REPORT / 17 DIAGRAMS</p><div id="diagramList"></div><p class="footer-help">修改自动保存在当前浏览器。<br>“保存编辑文件”备份全部图，<br>可在其他浏览器继续编辑。</p><button id="exportAll">导出全部 SVG（ZIP）</button></nav>
<article>
<div class="doc-heading"><select class="mobile-picker" id="diagramPicker" aria-label="选择流程图"></select><h2 id="diagramTitle"></h2><span id="count"></span></div>
<div class="toolbar" aria-label="绘图工具">
<button data-add="terminator">开始 / 结束</button><button data-add="process">处理</button><button data-add="decision">判断</button><button data-add="data">输入 / 输出</button><button data-add="subprocess">子程序</button><button data-add="connector">连接点</button><button data-add="document">文档</button><span class="sep"></span><button id="connect" aria-pressed="false">连线</button><button id="remove" disabled>删除</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button>
</div>
<div class="options"><label><input type="checkbox" id="snap" checked>网格吸附（10 px）</label><label><input type="checkbox" id="align" checked>对齐吸附</label><label><input type="checkbox" id="grid">显示网格</label><div class="zoom"><button id="zoomOut" aria-label="缩小">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="fit">适合宽度</button></div></div>
<div id="stage"><svg id="diagram" xmlns="http://www.w3.org/2000/svg" aria-label="可编辑流程图" tabindex="0"></svg></div>
<div class="statusbar"><span id="status" role="status" aria-live="polite">拖动方块调整位置，选中连线后拖动方形控制点。</span><span id="saveState">已就绪</span></div>
</article>
<aside><h2 id="panelTitle">图形属性</h2><div id="inspector"></div><div class="hint"><p><strong>操作提示</strong>拖动方块：网格与边缘对齐吸附。<br>双击方块：编辑文字。<br>选中方块：拖动右下角改变尺寸。<br>点击连接端点，再点击另一端点即可连线。<br>选中连线：拖动方形控制点移动折线段。<br>“增加折弯”可增加可拖动线段。<br><kbd>Delete</kbd> 删除，<kbd>Esc</kbd> 取消。<br><kbd>⌘ / Ctrl + Z</kbd> 撤销。<br>方向键微调，<kbd>Shift</kbd> 加大步长。</p></div></aside>
</main>
<input id="fileInput" type="file" accept=".json,application/json" hidden>
<dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="panel-actions"><button id="cancelConfirm">取消</button><button id="acceptConfirm" class="primary">确认</button></div></dialog>
<script>const INITIAL_DIAGRAMS = /*__DIAGRAMS__*/;</script>
<script>/*__EDITOR__*/</script>
</body></html>
